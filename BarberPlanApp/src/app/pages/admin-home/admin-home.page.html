<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>¡Bienvenido, {{ user?.nombre }}!</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Panel Admin</ion-title>
    </ion-toolbar>
  </ion-header>
  <ng-container [ngSwitch]="activeSection">
    <ion-list *ngSwitchCase="'calendario'">
      <ion-list-header>
        <ion-label>Calendario</ion-label>
      </ion-list-header>

      <ion-item button detail>
        <ion-icon slot="start" name="calendar-outline" color="success"></ion-icon>
        <ion-label>
          <h2>Citas</h2>
          <p>Ver y gestionar todas las citas</p>
        </ion-label>
      </ion-item>
    </ion-list>

    <ion-list *ngSwitchCase="'perfil'">
      <ion-list-header>
        <ion-label>Perfil</ion-label>
      </ion-list-header>

      <ion-item button detail>
        <ion-icon slot="start" name="business-outline" color="primary"></ion-icon>
        <ion-label>
          <h2>Datos de la Barbería</h2>
        </ion-label>
      </ion-item>
    </ion-list>

    <ion-list *ngSwitchDefault>
      <ion-list-header>
        <ion-label>Configuración</ion-label>
      </ion-list-header>

      <ion-item button detail>
        <ion-icon slot="start" name="cut-outline" color="secondary"></ion-icon>
        <ion-label>
          <h2>Servicios</h2>
          <p>Gestionar cortes y servicios</p>
        </ion-label>
      </ion-item>

      <ion-item button detail>
        <ion-icon slot="start" name="key-outline" color="warning"></ion-icon>
        <ion-label>
          <h2>Código de Barbería</h2>
          <p>Ver código para invitar barberos</p>
        </ion-label>
      </ion-item>

      <ion-item button detail>
        <ion-icon slot="start" name="people-outline" color="tertiary"></ion-icon>
        <ion-label>
          <h2>Barberos</h2>
          <p>Ver barberos asociados</p>
        </ion-label>
      </ion-item>
    </ion-list>
  </ng-container>
</ion-content>

<ion-footer class="admin-footer">
  <ion-toolbar>
    <div class="admin-bottom-menu">
      <ion-button
        fill="clear"
        aria-label="Calendario"
        title="Calendario"
        [class.is-active]="activeSection === 'calendario'"
        (click)="setSection('calendario')"
      >
        <ion-icon name="calendar-outline"></ion-icon>
      </ion-button>

      <ion-button
        fill="clear"
        aria-label="Perfil"
        title="Perfil"
        [class.is-active]="activeSection === 'perfil'"
        (click)="setSection('perfil')"
      >
        <ion-icon name="person-outline"></ion-icon>
      </ion-button>

      <ion-button
        fill="clear"
        aria-label="Configuración"
        title="Configuración"
        [class.is-active]="activeSection === 'configuracion'"
        (click)="setSection('configuracion')"
      >
        <ion-icon name="settings-outline"></ion-icon>
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
