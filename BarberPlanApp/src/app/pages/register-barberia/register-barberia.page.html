<ion-content class="bg-dark-900">
  <!-- Contenedor principal -->
  <div class="h-screen flex flex-col items-center px-4 py-6 overflow-y-auto">
    
    <!-- Logo y título -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-dynamic-text mb-1">BarberPlan</h1>
      <p class="text-gold-400 text-sm">Registra tu barbería</p>
    </div>

    <!-- Indicador de pasos mejorado -->
    <div class="w-full max-w-md mb-8">
      <div class="flex items-center justify-between px-4">
        <!-- Paso 1 -->
        <div class="flex flex-col items-center flex-1">
          <div 
            [class]="'w-10 h-10 rounded-full flex items-center justify-center font-bold transition-all duration-300 ' +
                     (currentStep >= 1 ? 'bg-gold-500 text-dark-900 ring-2 ring-gold-500' : 'bg-dark-700 text-gray-400 ring-2 ring-dark-600')"
          >
            <span *ngIf="currentStep > 1" class="text-lg">✓</span>
            <span *ngIf="currentStep <= 1">1</span>
          </div>
          <p class="text-xs text-gray-400 mt-2 text-center">Barbería</p>
        </div>

        <!-- Línea conectora -->
        <div 
          [class]="'flex-1 h-1 mx-3 rounded transition-all duration-300 ' +
                   (currentStep > 1 ? 'bg-gold-500' : 'bg-dark-700')"
        ></div>

        <!-- Paso 2 -->
        <div class="flex flex-col items-center flex-1">
          <div 
            [class]="'w-10 h-10 rounded-full flex items-center justify-center font-bold transition-all duration-300 ' +
                     (currentStep >= 2 ? 'bg-gold-500 text-dark-900 ring-2 ring-gold-500' : 'bg-dark-700 text-dynamic-muted ring-2 ring-dark-600')"
          >
            2
          </div>
          <p class="text-xs text-dynamic-muted mt-2 text-center">Admin</p>
        </div>
      </div>
    </div>

    <!-- Formulario con pasos -->
    <div class="w-full max-w-md">
      <form (ngSubmit)="onSubmit()" class="space-y-6">

        <!-- PASO 1: Datos de la Barbería -->
        <div *ngIf="currentStep === 1" class="step-content">
          <div class="bg-dark-800 rounded-2xl border border-dark-700 overflow-hidden shadow-2xl">
            
            <!-- Header -->
            <div class="px-8 pt-8 pb-4">
              <h2 class="text-2xl font-bold text-dynamic-text mb-2">Datos de la Barbería</h2>
              <p class="text-dynamic-muted text-sm mb-6">Información principal de tu negocio</p>
            </div>

            <!-- Contenido -->
            <div class="px-8 pb-8 space-y-5">
              <!-- Nombre barbería -->
              <div>
                <label class="block text-dynamic-text text-sm font-medium mb-2">Nombre de la Barbería *</label>
                <input
                  type="text"
                  [(ngModel)]="formData.nombreBarberia"
                  name="nombreBarberia"
                  placeholder="Ej: Javi2Barber"
                  required
                  class="w-full px-3 py-2 rounded-lg bg-dark-700 border border-dark-600 text-dynamic-text text-sm placeholder-gray-500 focus:outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20 transition duration-300"
                />
              </div>

              <!-- Ciudad -->
              <div>
                <label class="block text-dynamic-text text-sm font-medium mb-2">Ciudad *</label>
                <select
                  [(ngModel)]="formData.ciudad"
                  name="ciudad"
                  required
                  class="w-full px-4 py-3 rounded-lg bg-dark-700 border border-dark-600 text-dynamic-text focus:outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20 transition duration-300"
                >
                  <option value="" disabled>Selecciona una ciudad</option>
                  <option *ngFor="let ciudad of ciudades" [value]="ciudad">{{ ciudad }}</option>
                </select>
              </div>

              <!-- Dirección -->
              <div>
                <label class="block text-dynamic-text text-sm font-medium mb-2">Dirección Completa *</label>
                <input
                  type="text"
                  [(ngModel)]="formData.direccion"
                  name="direccion"
                  placeholder="Calle Principal 123"
                  required
                  class="w-full px-3 py-2 rounded-lg bg-dark-700 border border-dark-600 text-dynamic-text text-sm placeholder-gray-500 focus:outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20 transition duration-300"
                />
              </div>

              <!-- Teléfono -->
              <div>
                <label class="block text-dynamic-text text-sm font-medium mb-2">Teléfono *</label>
                <input
                  type="tel"
                  [(ngModel)]="formData.telefono"
                  name="telefono"
                  placeholder="+34 600 123 456"
                  class="w-full px-3 py-2 rounded-lg bg-dark-700 border border-dark-600 text-dynamic-text text-sm placeholder-gray-500 focus:outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20 transition duration-300"
                />
              </div>

              <!-- Descripción -->
              <div>
                <label class="block text-dynamic-text text-sm font-medium mb-2">Descripción</label>
                <textarea
                  [(ngModel)]="formData.descripcion"
                  name="descripcion"
                  placeholder="Describe tu barbería..."
                  rows="3"
                  class="w-full px-3 py-2 rounded-lg bg-dark-700 border border-dark-600 text-dynamic-text text-sm placeholder-gray-500 focus:outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20 transition duration-300 resize-none"
                ></textarea>
              </div>

              <!-- Botón siguiente -->
              <button
                type="button"
                (click)="nextStep()"
                [disabled]="!isStep1Valid()"
                [class]="'w-full py-3 px-4 rounded-lg font-bold transition duration-300 transform ' +
                         (isStep1Valid() 
                          ? 'bg-gold-500 hover:bg-gold-600 text-dark-900 hover:scale-105 shadow-lg' 
                          : 'bg-dark-600 text-dynamic-muted cursor-not-allowed')"
              >
                Siguiente
                <span class="ml-2">→</span>
              </button>
            </div>
          </div>
        </div>

        <!-- PASO 2: Datos del Administrador -->
        <div *ngIf="currentStep === 2" class="step-content">
          <div class="bg-dark-800 rounded-2xl border border-dark-700 overflow-hidden shadow-2xl">
            
            <!-- Header -->
            <div class="px-8 pt-8 pb-4">
              <h2 class="text-2xl font-bold text-dynamic-text mb-2">Tu Cuenta de Admin</h2>
              <p class="text-dynamic-muted text-sm">Datos para acceder como administrador</p>
            </div>

            <!-- Contenido -->
            <div class="px-8 pb-8 space-y-5">
              <!-- Fila: Nombre y Apellido -->
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-dynamic-text text-sm font-medium mb-2">Nombre *</label>
                  <input
                    type="text"
                    [(ngModel)]="formData.nombre"
                    name="nombre"
                    placeholder="Tu nombre"
                    required
                    class="w-full px-3 py-2 rounded-lg bg-dark-700 border border-dark-600 text-dynamic-text text-sm placeholder-gray-500 focus:outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20 transition duration-300"
                  />
                </div>

                <div>
                  <label class="block text-dynamic-text text-sm font-medium mb-2">Apellidos *</label>
                  <input
                    type="text"
                    [(ngModel)]="formData.apellido"
                    name="apellido"
                    placeholder="Tu apellido"
                    required
                    class="w-full px-3 py-2 rounded-lg bg-dark-700 border border-dark-600 text-dynamic-text text-sm placeholder-gray-500 focus:outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20 transition duration-300"
                  />
                </div>
              </div>

              <!-- Usuario -->
              <div>
                <label class="block text-dynamic-text text-sm font-medium mb-2">Usuario *</label>
                <input
                  type="text"
                  [(ngModel)]="formData.usuario"
                  name="usuario"
                  placeholder="Tu usuario"
                  required
                  class="w-full px-3 py-2 rounded-lg bg-dark-700 border border-dark-600 text-dynamic-text text-sm placeholder-gray-500 focus:outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20 transition duration-300"
                />
              </div>

              <!-- Email -->
              <div>
                <label class="block text-dynamic-text text-sm font-medium mb-2">Correo electrónico *</label>
                <input
                  type="email"
                  [(ngModel)]="formData.correo"
                  name="correo"
                  placeholder="tu@email.com"
                  required
                  class="w-full px-3 py-2 rounded-lg bg-dark-700 border border-dark-600 text-dynamic-text text-sm placeholder-gray-500 focus:outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20 transition duration-300"
                />
              </div>

              <!-- Fila: Contraseña y Confirmar -->
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-dynamic-text text-sm font-medium mb-2">Contraseña *</label>
                  <div class="relative">
                    <input
                      [type]="showPassword ? 'text' : 'password'"
                      [(ngModel)]="formData.pw"
                      name="pw"
                      placeholder="Mínimo 6 caracteres"
                      required
                      class="w-full px-3 py-2 rounded-lg bg-dark-700 border border-dark-600 text-dynamic-text text-sm placeholder-dynamic-muted focus:outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20 transition duration-300 pr-8"
                    />
                    <button
                      type="button"
                      (click)="showPassword = !showPassword"
                      class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gold-400 text-sm"
                    >
                      {{ showPassword ? '👁️' : '👁️‍🗨️' }}
                    </button>
                  </div>
                </div>

                <div>
                  <label class="block text-gray-300 text-xs font-medium mb-2">Confirmar *</label>
                  <input
                    [type]="showPassword ? 'text' : 'password'"
                    [(ngModel)]="confirmPw"
                    name="confirmPw"
                    placeholder="Repite contraseña"
                    required
                    class="w-full px-3 py-2 rounded-lg bg-dark-700 border border-dark-600 text-dynamic-text text-sm placeholder-dynamic-muted focus:outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20 transition duration-300"
                  />
                </div>
              </div>

              <!-- Botones de acción -->
              <div class="flex gap-3 mt-8">
                <button
                  type="button"
                  (click)="prevStep()"
                  class="flex-1 py-3 px-4 border border-gold-500 hover:bg-gold-500/10 text-gold-400 font-semibold rounded-lg transition duration-300"
                >
                  ← Anterior
                </button>
                
                <button
                  type="submit"
                  [disabled]="!isStep2Valid() || isLoading"
                  [class]="'flex-1 py-3 px-4 rounded-lg font-bold transition duration-300 flex items-center justify-center gap-2 ' +
                           (isStep2Valid() && !isLoading
                            ? 'bg-gold-500 hover:bg-gold-600 text-dark-900 hover:scale-105 shadow-lg'
                            : 'bg-dark-600 text-gray-500 cursor-not-allowed')"
                >
                  <ion-spinner *ngIf="isLoading" name="crescent" class="text-sm"></ion-spinner>
                  <span *ngIf="!isLoading">Registrar</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </form>

      <!-- Enlaces de navegación -->
      <div class="text-center mt-6 space-y-2">
        <p class="text-gray-500 text-xs">
          <span class="text-gray-400">¿Ya tienes cuenta?</span>
          <button
            type="button"
            routerLink="/login"
            class="text-link-btn"
          >
            Inicia sesión
          </button>
        </p>
        <p class="text-gray-500 text-xs">
          <span class="text-gray-400">¿Eres barbero o cliente?</span>
          <button
            type="button"
            routerLink="/register"
            class="text-gold-400 hover:text-gold-300 font-semibold ml-1 transition"
          >
            Regístrate aquí
          </button>
        </p>
      </div>
    </div>
  </div>
</ion-content>
