<ion-content class="bg-dark-900">
  <div class="auth-container">
    
    <!-- Branding -->
    <div class="auth-brand">
      <ion-icon src="assets/icon/logo.svg" class="auth-brand-logo"></ion-icon>
      <div class="auth-brand-text">
        <h1 class="auth-brand-title">BarberPlan</h1>
        <p class="auth-brand-subtitle">Registra tu barbería</p>
      </div>
    </div>

    <!-- Formulario con pasos -->
    <form (ngSubmit)="onSubmit()" class="w-full">

      <!-- PASO 1: Datos de la Barbería -->
      <div *ngIf="currentStep === 1" class="auth-card">
        <div class="auth-card-header">
          <div class="auth-step-indicator">Paso 1 de 2</div>
          <h2 class="auth-card-title">Datos de la Barbería</h2>
          <p class="auth-card-desc">Información principal de tu negocio</p>
        </div>

        <div class="auth-form">
          <!-- Nombre barbería -->
          <div class="auth-field">
            <label class="auth-label">Nombre de la Barbería *</label>
            <input
              type="text"
              [(ngModel)]="formData.nombreBarberia"
              name="nombreBarberia"
              placeholder="Ej: Javi2Barber"
              required
              class="auth-input"
            />
          </div>

          <!-- Ciudad -->
          <div class="auth-field">
            <label class="auth-label">Ciudad *</label>
            <select
              [(ngModel)]="formData.ciudad"
              name="ciudad"
              required
              class="auth-input auth-select"
            >
              <option value="" disabled>Selecciona una ciudad</option>
              <option *ngFor="let ciudad of ciudades" [value]="ciudad">{{ ciudad }}</option>
            </select>
          </div>

          <!-- Dirección -->
          <div class="auth-field">
            <label class="auth-label">Dirección Completa *</label>
            <input
              type="text"
              [(ngModel)]="formData.direccion"
              name="direccion"
              placeholder="Calle Principal 123"
              required
              class="auth-input"
            />
          </div>

          <!-- Teléfono -->
          <div class="auth-field">
            <label class="auth-label">Teléfono *</label>
            <app-phone-input [(ngModel)]="formData.telefono" name="telefono"></app-phone-input>
          </div>

          <!-- Descripción -->
          <div class="auth-field">
            <label class="auth-label">Descripción</label>
            <textarea
              [(ngModel)]="formData.descripcion"
              name="descripcion"
              placeholder="Describe tu barbería..."
              rows="3"
              class="auth-input auth-textarea"
            ></textarea>
          </div>

          <!-- Botón siguiente -->
          <button
            type="button"
            (click)="nextStep()"
            [disabled]="!isStep1Valid()"
            [class]="'auth-submit-btn' + (!isStep1Valid() ? ' auth-btn-disabled' : '')"
          >
            Siguiente <span class="ml-2">→</span>
          </button>
        </div>
      </div>

      <!-- PASO 2: Datos del Administrador -->
      <div *ngIf="currentStep === 2" class="auth-card">
        <div class="auth-card-header">
          <div class="auth-step-indicator">Paso 2 de 2</div>
          <h2 class="auth-card-title">Tu Cuenta de Admin</h2>
          <p class="auth-card-desc">Datos para acceder como administrador</p>
        </div>

        <div class="auth-form">
          <!-- Fila: Nombre y Apellido -->
          <div class="auth-row">
            <div class="auth-field">
              <label class="auth-label">Nombre *</label>
              <input
                type="text"
                [(ngModel)]="formData.nombre"
                name="nombre"
                placeholder="Tu nombre"
                required
                class="auth-input"
              />
            </div>
            <div class="auth-field">
              <label class="auth-label">Apellidos *</label>
              <input
                type="text"
                [(ngModel)]="formData.apellido"
                name="apellido"
                placeholder="Tu apellido"
                required
                class="auth-input"
              />
            </div>
          </div>

          <!-- Usuario -->
          <div class="auth-field">
            <label class="auth-label">Usuario *</label>
            <input
              type="text"
              [(ngModel)]="formData.usuario"
              name="usuario"
              placeholder="Tu usuario"
              required
              class="auth-input"
            />
          </div>

          <!-- Email -->
          <div class="auth-field">
            <label class="auth-label">Correo electrónico *</label>
            <input
              type="email"
              [(ngModel)]="formData.correo"
              name="correo"
              placeholder="tu@email.com"
              required
              class="auth-input"
            />
          </div>

          <!-- Fila: Contraseña y Confirmar -->
          <div class="auth-row">
            <div class="auth-field">
              <label class="auth-label">Contraseña *</label>
              <div class="auth-password-wrap">
                <input
                  [type]="showPassword ? 'text' : 'password'"
                  [(ngModel)]="formData.pw"
                  name="pw"
                  placeholder="Mínimo 8, con letra y número"
                  required
                  class="auth-input"
                />
                <button
                  type="button"
                  (click)="showPassword = !showPassword"
                  class="auth-password-toggle"
                >
                  {{ showPassword ? '👁️' : '👁️‍🗨️' }}
                </button>
              </div>
            </div>
            <div class="auth-field">
              <label class="auth-label">Confirmar *</label>
              <input
                [type]="showPassword ? 'text' : 'password'"
                [(ngModel)]="confirmPw"
                name="confirmPw"
                placeholder="Repite contraseña"
                required
                class="auth-input"
              />
            </div>
          </div>

          <!-- Botones de acción -->
          <div class="auth-actions-row">
            <button
              type="button"
              (click)="prevStep()"
              class="auth-secondary-btn"
            >
              ← Anterior
            </button>
            <button
              type="submit"
              [disabled]="!isStep2Valid() || isLoading"
              [class]="'auth-submit-btn' + (!isStep2Valid() || isLoading ? ' auth-btn-disabled' : '')"
            >
              <ion-spinner *ngIf="isLoading" name="crescent" style="width:18px;height:18px;"></ion-spinner>
              <span *ngIf="!isLoading">Registrar</span>
            </button>
          </div>
        </div>
      </div>

    </form>

    <!-- Enlaces de navegación -->
    <div class="auth-links">
      <p>
        <span>¿Ya tienes cuenta?</span>
        <button type="button" routerLink="/login" class="text-link-btn">Inicia sesión</button>
      </p>
      <p>
        <span>¿Eres barbero o cliente?</span>
        <button type="button" routerLink="/register" class="text-link-btn">Regístrate aquí</button>
      </p>
    </div>

  </div>
</ion-content>
