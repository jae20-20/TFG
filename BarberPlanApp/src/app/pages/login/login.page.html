<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Bienvenido a BarberPlan</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <!-- Título compacto cuando haces scroll -->
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Iniciar sesión</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Formulario de login -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Bienvenido</ion-card-title>
      <ion-card-subtitle>Introduzca sus credenciales</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-item>
        <ion-label position="floating">Correo</ion-label>
        <ion-input type="text" [(ngModel)]="correo"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Contraseña</ion-label>
        <ion-input type="password" [(ngModel)]="pw"></ion-input>
      </ion-item>

      <ion-button expand="block" class="ion-margin-top" (click)="login()">Entrar</ion-button>

      <ion-button expand="block" fill="clear" (click)="goToRegister()">
        Crear cuenta nueva
      </ion-button>
    </ion-card-content>
  </ion-card>

</ion-content>
