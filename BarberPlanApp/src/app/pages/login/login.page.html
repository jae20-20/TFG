<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Iniciar sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Bienvenido</ion-card-title>
      <ion-card-subtitle>Inicia sesión para continuar</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <form (ngSubmit)="login()">
        <ion-item>
          <ion-label position="floating">Correo</ion-label>
          <ion-input type="email" [(ngModel)]="correo" name="correo" required></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Contraseña</ion-label>
          <ion-input type="password" [(ngModel)]="pw" name="pw" required></ion-input>
        </ion-item>

        <ion-button expand="block" type="submit" class="ion-margin-top">Iniciar sesión</ion-button>
      </form>

      <div class="ion-text-center ion-margin-top">
        <p>¿No tienes cuenta?</p>
        <ion-button fill="clear" size="small" (click)="goToRegister()">Registrarse</ion-button>
      </div>

      <div class="ion-text-center ion-margin-top">
        <p>¿Tienes una barbería?</p>
        <ion-button fill="outline" size="small" color="secondary" (click)="goToBarberiaRegister()">
          Registra tu barbería
        </ion-button>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
