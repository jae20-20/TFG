<ion-content class="bg-dark-900">
  <div class="auth-container auth-container-centered">
    
    <!-- Branding -->
    <div class="auth-brand">
      <ion-icon src="assets/icon/logo.svg" class="auth-brand-logo"></ion-icon>
      <div class="auth-brand-text">
        <h1 class="auth-brand-title">BarberPlan</h1>
        <p class="auth-brand-subtitle">Gestión premium de barberías</p>
      </div>
    </div>

    <!-- Tarjeta de login -->
    <div class="auth-card">
      <!-- Header -->
      <div class="auth-card-header">
        <h2 class="auth-card-title">Iniciar Sesión</h2>
        <p class="auth-card-desc">Accede a tu cuenta de BarberPlan</p>
      </div>

      <!-- Formulario -->
      <form (ngSubmit)="login()" class="auth-form">
        <div class="auth-field">
          <label class="auth-label">Email</label>
          <input
            type="email"
            [(ngModel)]="correo"
            name="correo"
            placeholder="tu@email.com"
            required
            class="auth-input"
          />
        </div>

        <div class="auth-field">
          <label class="auth-label">Contraseña</label>
          <input
            type="password"
            [(ngModel)]="pw"
            name="pw"
            placeholder="Tu contraseña"
            required
            class="auth-input"
          />
        </div>

        <button type="submit" class="auth-submit-btn">
          Iniciar Sesión
        </button>
      </form>
    </div>

    <!-- Enlaces de navegación -->
    <div class="auth-links">
      <p>
        <span>¿Primera vez aquí?</span>
        <button type="button" (click)="goToRegister()" class="text-link-btn">Crea tu cuenta</button>
      </p>
      <p>
        <span>¿Tienes una barbería?</span>
        <button type="button" (click)="goToBarberiaRegister()" class="text-link-btn">Regístrala aquí</button>
      </p>
    </div>

  </div>
</ion-content>
