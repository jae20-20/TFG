<ion-content class="bg-dark-900">
  <!-- Contenedor principal -->
  <div class="h-screen flex flex-col items-center justify-center px-4 py-6">
    
    <!-- Logo y título -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-white mb-2">BarberPlan</h1>
      <p class="text-gold-400 text-lg">Gestión premium de barberías</p>
    </div>

    <!-- Formulario de login -->
    <div class="w-full max-w-md">
      <div class="bg-dark-800 rounded-2xl border border-dark-700 overflow-hidden shadow-2xl">
        
        <!-- Header de la tarjeta -->
        <div class="px-8 pt-8 pb-4">
          <h2 class="text-3xl font-bold text-white mb-2">Iniciar Sesión</h2>
          <p class="text-gray-400 text-sm">Accede a tu cuenta de BarberPlan</p>
        </div>

        <!-- Contenido del formulario -->
        <div class="px-8 pb-8">
          <form (ngSubmit)="login()" class="space-y-6">
            <!-- Campo de Email -->
            <div>
              <label class="block text-gray-300 text-sm font-medium mb-3">Email</label>
              <input
                type="email"
                [(ngModel)]="correo"
                name="correo"
                placeholder="tu@email.com"
                required
                class="w-full px-4 py-3 rounded-lg bg-dark-700 border border-dark-600 text-white placeholder-gray-500 focus:outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20 transition duration-300"
              />
            </div>

            <!-- Campo de Contraseña -->
            <div>
              <label class="block text-gray-300 text-sm font-medium mb-3">Contraseña</label>
              <input
                type="password"
                [(ngModel)]="pw"
                name="pw"
                placeholder="Tu contraseña"
                required
                class="w-full px-4 py-3 rounded-lg bg-dark-700 border border-dark-600 text-white placeholder-gray-500 focus:outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20 transition duration-300"
              />
            </div>

            <!-- Botón principal -->
            <button
              type="submit"
              class="w-full py-3 px-4 bg-gold-500 hover:bg-gold-600 text-dark-900 font-bold rounded-lg transition duration-300 transform hover:scale-105 shadow-lg"
            >
              Iniciar Sesión
            </button>
          </form>

          <!-- Separador -->
          <div class="relative my-8">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-dark-600"></div>
            </div>
          </div>

  
          
        </div>
      </div>

      <!-- Pie de página -->
      <div class="text-center mt-6">
        <p class="text-gray-500 text-sm">
          <span class="text-gray-400">¿Primera vez aquí?</span>
          <button
            type="button"
            (click)="goToRegister()"
            class="text-gold-400 hover:text-gold-300 font-semibold ml-1 transition"
          >
            Crea tu cuenta
          </button>
        </p>
        <p class="text-gray-500 text-sm">
          <span class="text-gray-400">¿Tienes una barbería?</span>
          <button
            type="button"
            (click)="goToBarberiaRegister()"
            class="text-gold-400 hover:text-gold-300 font-semibold ml-1 transition"
          >
            Regístrala aquí
          </button>
        </p>
      </div>
    </div>
  </div>
</ion-content>
