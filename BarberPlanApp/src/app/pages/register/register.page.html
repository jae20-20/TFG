<ion-content class="bg-dark-900">
  <div class="auth-container">
    
    <!-- Branding -->
    <div class="auth-brand">
      <ion-icon src="assets/icon/logo.svg" class="auth-brand-logo"></ion-icon>
      <div class="auth-brand-text">
        <h1 class="auth-brand-title">BarberPlan</h1>
        <p class="auth-brand-subtitle">Gestión premium de barberías</p>
      </div>
    </div>

    <!-- Tarjeta de registro -->
    <div class="auth-card">
      <!-- Header -->
      <div class="auth-card-header">
        <h2 class="auth-card-title">Crear Cuenta</h2>
        <p class="auth-card-desc">Únete a BarberPlan en segundos</p>
      </div>

      <!-- Formulario -->
      <form (ngSubmit)="register()" class="auth-form">
        <!-- Fila: Nombre y Apellido -->
        <div class="auth-row">
          <div class="auth-field">
            <label class="auth-label">Nombre</label>
            <input
              type="text"
              [(ngModel)]="nombre"
              name="nombre"
              placeholder="Tu nombre"
              required
              class="auth-input"
            />
          </div>
          <div class="auth-field">
            <label class="auth-label">Apellido</label>
            <input
              type="text"
              [(ngModel)]="apellido"
              name="apellido"
              placeholder="Tu apellido"
              required
              class="auth-input"
            />
          </div>
        </div>

        <!-- Usuario -->
        <div class="auth-field">
          <label class="auth-label">Usuario</label>
          <input
            type="text"
            [(ngModel)]="usuario"
            name="usuario"
            placeholder="Tu nombre de usuario"
            required
            class="auth-input"
          />
        </div>

        <!-- Email -->
        <div class="auth-field">
          <label class="auth-label">Email</label>
          <input
            type="email"
            [(ngModel)]="correo"
            name="correo"
            placeholder="tu@email.com"
            required
            class="auth-input"
          />
        </div>

        <!-- Tipo de Cuenta -->
        <div class="auth-field">
          <label class="auth-label">Tipo de Cuenta</label>
          <select
            [(ngModel)]="rol"
            name="rol"
            required
            class="auth-input auth-select"
          >
            <option value="" disabled selected>Selecciona un tipo</option>
            <option value="cliente">Cliente</option>
            <option value="barbero">Barbero</option>
          </select>
        </div>

        <!-- Ciudad (solo cliente) -->
        <div *ngIf="rol === 'cliente'" class="auth-field">
          <label class="auth-label">Ciudad *</label>
          <select
            [(ngModel)]="ciudad"
            name="ciudad"
            required
            class="auth-input auth-select"
          >
            <option value="" disabled selected>Selecciona una ciudad</option>
            <option *ngFor="let city of ciudades" [value]="city">{{ city }}</option>
          </select>
        </div>

        <!-- Código de Barbería (solo barbero) -->
        <div *ngIf="rol === 'barbero'" class="auth-field">
          <label class="auth-label">Código de Barbería</label>
          <input
            type="text"
            [(ngModel)]="code"
            name="codigoBarberia"
            placeholder="Código proporcionado"
            required
            class="auth-input"
          />
          <p class="auth-hint">Solicita el código a tu barbería</p>
        </div>

        <!-- Fila: Contraseña y Confirmar -->
        <div class="auth-row">
          <div class="auth-field">
            <label class="auth-label">Contraseña</label>
            <input
              type="password"
              [(ngModel)]="pw"
              name="pw"
              placeholder="Mínimo 6 caracteres"
              required
              class="auth-input"
            />
          </div>
          <div class="auth-field">
            <label class="auth-label">Confirmar</label>
            <input
              type="password"
              [(ngModel)]="confirmPw"
              name="confirmPw"
              placeholder="Repite contraseña"
              required
              class="auth-input"
            />
          </div>
        </div>

        <button type="submit" class="auth-submit-btn">
          Crear Cuenta
        </button>
      </form>
    </div>

    <!-- Enlaces de navegación -->
    <div class="auth-links">
      <p>
        <span>¿Ya tienes cuenta?</span>
        <button type="button" (click)="goToLogin()" class="text-link-btn">Inicia sesión aquí</button>
      </p>
      <p>
        <span>¿Tienes una barbería?</span>
        <button type="button" (click)="goToBarberiaRegister()" class="text-link-btn">Regístrala aquí</button>
      </p>
    </div>

  </div>
</ion-content>
