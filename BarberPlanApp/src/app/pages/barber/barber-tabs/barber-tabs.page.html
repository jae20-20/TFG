<ion-header [translucent]="true">
  <ion-toolbar class="barber-topbar">
    <ion-buttons slot="start">
      <ion-button *ngIf="showBackButton" fill="clear" class="small-golden-back" (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title class="barber-topbar-title boutique-title">
      <div style="display: flex; align-items: center; gap: 8px;">
        <ion-icon src="assets/icon/logo.svg" style="color: var(--ion-color-primary); font-size: 1.5rem; flex-shrink: 0;"></ion-icon>
        <span>{{ pageName || 'BarberPlan' }}</span>
      </div>
    </ion-title>

    <ion-buttons slot="end">
      <app-theme-header-btn></app-theme-header-btn>
      <ion-button class="barber-logout-btn" (click)="logout()" title="Cerrar sesión">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-tabs>
    <ion-tab-bar slot="bottom" class="barber-footer">
      <ion-tab-button tab="calendar">
        <ion-icon name="calendar-outline"></ion-icon>
      </ion-tab-button>
  
      <ion-tab-button tab="configuration">
        <ion-icon name="settings-outline"></ion-icon>
      </ion-tab-button>
  
      <ion-tab-button tab="profile">
        <ion-icon name="person-outline"></ion-icon>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>
</ion-content>
