<ion-header [translucent]="true">
  <ion-toolbar class="barber-topbar">
    <ion-title class="barber-topbar-title">¡Bienvenido, {{ user?.nombre }}!</ion-title>
    <ion-buttons slot="end">
      <ion-button class="barber-logout-btn" (click)="logout()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-tabs>
    <ion-tab-bar slot="bottom" class="barber-footer">
      <ion-tab-button tab="calendar">
        <ion-icon name="calendar-outline"></ion-icon>
        <ion-label>Calendario</ion-label>
      </ion-tab-button>
  
      <ion-tab-button tab="configuration">
        <ion-icon name="settings-outline"></ion-icon>
        <ion-label>Configuración</ion-label>
      </ion-tab-button>
  
      <ion-tab-button tab="profile">
        <ion-icon name="person-outline"></ion-icon>
        <ion-label>Perfil</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>
</ion-content>
