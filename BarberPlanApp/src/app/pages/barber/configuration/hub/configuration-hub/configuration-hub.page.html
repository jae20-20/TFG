<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Ajustes internos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding barber-premium-content">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Configuración</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list class="config-hub-list">
    <!-- <ion-list-header>
      <ion-label>Gestión</ion-label>
    </ion-list-header> -->

    <ion-item button detail routerLink="/barber/configuration/barbershop-details">
      <ion-icon slot="start" name="time-outline" color="primary"></ion-icon>
      <ion-label>
        <h2>Mi barbería</h2>
      </ion-label>
    </ion-item>

    <ion-item button detail routerLink="/barber/configuration/catalogo-servicios">
      <ion-icon slot="start" name="cut-outline" color="success"></ion-icon>
      <ion-label>
        <h2>Servicios</h2>
      </ion-label>
    </ion-item>
    
    <!-- <ion-list-header>
      <ion-label>Otros</ion-label>
    </ion-list-header> -->
    
    <ion-item button detail routerLink="/barber/configuration/solicitudes">
      <ion-icon slot="start" name="mail-unread-outline" color="tertiary"></ion-icon>
      <ion-label>
        <h2>Solicitudes</h2>
      </ion-label>
    </ion-item>

  </ion-list>
</ion-content>
