

<ion-content class="ion-padding">
  <ion-list>
    <ion-item *ngFor="let barber of barberos" (click)="openBarber(barber)">
      <ion-label>
        <h2>{{ barber.nombre }} {{ barber.apellido }}</h2>
        <p>{{ barber.cargo || 'Barbero' }}</p>
      </ion-label>
      <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
    </ion-item>
  </ion-list>
</ion-content>
