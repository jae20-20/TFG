

<ion-content class="ion-padding">
  <ion-list>
    <ion-item *ngFor="let barber of barberos" (click)="openBarber(barber)" [ngClass]="{'admin-item': isAdmin(barber)}">
      <ion-label>
        <h2>{{ barber.nombre }} {{ barber.apellido }} <span *ngIf="isAdmin(barber)" class="admin-badge">(Tú)</span></h2>
        <p *ngIf="!isAdmin(barber)">{{ barber.cargo || 'Barbero' }}</p>
        <p *ngIf="isAdmin(barber)" class="admin-role-text">Admin</p>
      </ion-label>
      <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
    </ion-item>
  </ion-list>
</ion-content>
