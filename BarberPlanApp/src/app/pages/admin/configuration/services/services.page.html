

<ion-content [fullscreen]="true" class="ion-padding admin-premium-content">
  <div class="services-section" *ngIf="!loading">
    <div class="services-list" *ngIf="barberia?.servicios?.length > 0; else noServices">
      <div class="service-card" *ngFor="let servicio of barberia.servicios">
        <div class="service-card-head">
          <div>
            <h4>{{ servicio.nombre }}</h4>
            <p>{{ servicio.duracion }} min · {{ servicio.precio }} €</p>
          </div>

          <ion-button
            fill="clear"
            size="small"
            color="danger"
            class="delete-service-button"
            (click)="confirmDeleteServicio(servicio)"
            [disabled]="deletingServicioId === servicio._id"
          >
            <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
          </ion-button>
        </div>

        <p class="service-description" *ngIf="servicio.descripcion">
          {{ servicio.descripcion }}
        </p>
      </div>
    </div>

    <ng-template #noServices>
      <div class="config-placeholder-card empty-state">
        <ion-icon name="cut-outline"></ion-icon>
        <h2>Sin Servicios</h2>
        <p>Todavía no hay servicios creados en tu catálogo.</p>
      </div>
    </ng-template>
  </div>

  <p *ngIf="loading" class="calendar-empty">Cargando servicios...</p>

  <!-- MODAL: Nuevo servicio -->
  <ion-modal [isOpen]="isAddModalOpen" (didDismiss)="closeAddModal()" class="premium-modal compact-modal">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>Nuevo Servicio</ion-title>
          <ion-buttons slot="end">
            <ion-button class="modal-close-btn" (click)="closeAddModal()">
              <ion-icon slot="icon-only" name="close-outline"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <div class="compact-modal-body">
        <ion-item lines="none" class="service-input-item ion-margin-bottom">
          <ion-label position="stacked">Nombre</ion-label>
          <ion-input type="text" placeholder="Corte clásico" [(ngModel)]="newServicioForm.nombre"></ion-input>
        </ion-item>

        <ion-item lines="none" class="service-input-item ion-margin-bottom">
          <ion-label position="stacked">Precio</ion-label>
          <ion-input type="number" inputmode="decimal" placeholder="12.50" [(ngModel)]="newServicioForm.precio"></ion-input>
        </ion-item>

        <ion-item lines="none" class="service-input-item">
          <ion-label position="stacked">Duración (min)</ion-label>
          <ion-input type="number" inputmode="numeric" placeholder="30" [(ngModel)]="newServicioForm.duracion"></ion-input>
        </ion-item>

        <p *ngIf="serviciosError" class="barberia-error ion-margin-top">{{ serviciosError }}</p>
      </div>

      <ion-footer>
        <ion-toolbar>
          <ion-button
            expand="block"
            class="premium-modal-button-solid ion-margin"
            (click)="addServicio()"
            [disabled]="savingServicio"
          >
            <ion-spinner *ngIf="savingServicio" name="crescent"></ion-spinner>
            <span *ngIf="!savingServicio">Añadir servicio</span>
          </ion-button>
        </ion-toolbar>
      </ion-footer>
    </ng-template>
  </ion-modal>

  <!-- FAB: Nuevo Servicio (abajo a la derecha) -->
  <div class="services-fab">
    <ion-button class="add-service-fab-btn" (click)="openAddModal()">
      <ion-icon slot="icon-only" name="add-outline"></ion-icon>
    </ion-button>
  </div>
</ion-content>
