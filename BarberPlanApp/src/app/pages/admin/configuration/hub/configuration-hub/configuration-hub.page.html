

<ion-content [fullscreen]="true" class="ion-padding admin-premium-content">
  

  <ion-list class="config-hub-list">
    <ion-list-header>
      <ion-label>General</ion-label>
    </ion-list-header>

    <ion-item button detail routerLink="/admin/configuration/barbershop-details">
      <ion-icon slot="start" name="business-outline" color="primary"></ion-icon>
      <ion-label>
        <h2>Mi Barbería</h2>
      </ion-label>
    </ion-item>

    <ion-item button detail routerLink="/admin/configuration/schedule">
      <ion-icon slot="start" name="time-outline" color="success"></ion-icon>
      <ion-label>
        <h2>Horario General</h2>
      </ion-label>
    </ion-item>

    <ion-item button detail routerLink="/admin/configuration/services">
      <ion-icon slot="start" name="cut-outline" color="secondary"></ion-icon>
      <ion-label>
        <h2>Catálogo de Servicios</h2>
      </ion-label>
    </ion-item>

    <ion-list-header>
      <ion-label>Personalización</ion-label>
    </ion-list-header>

    <ion-item button detail routerLink="/admin/configuration/card-configuration">
      <ion-icon slot="start" name="image-outline" color="tertiary"></ion-icon>
      <ion-label>
        <h2>Tarjeta Visual</h2>
      </ion-label>
    </ion-item>

    <ion-list-header>
      <ion-label>Equipo</ion-label>
    </ion-list-header>

    <ion-item button detail routerLink="/admin/configuration/manage-team">
      <ion-icon slot="start" name="people-outline" color="warning"></ion-icon>
      <ion-label>
        <h2>Gestión de Equipo</h2>
      </ion-label>
    </ion-item>

    <ion-item button detail routerLink="/admin/configuration/team-requests">
      <ion-icon slot="start" name="mail-unread-outline" color="danger"></ion-icon>
      <ion-label>
        <h2>Solicitudes de Equipo</h2>
      </ion-label>
    </ion-item>

  </ion-list>
</ion-content>
