<ion-header [translucent]="true">
  <ion-toolbar class="admin-topbar">
    <ion-buttons slot="start">
      <ion-button *ngIf="showBackButton" fill="clear" class="small-golden-back" (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    
    <ion-title class="admin-topbar-title">¡Bienvenido, {{ user?.nombre }}!</ion-title>
    
    <ion-buttons slot="end">
      <div class="golden-page-badge" style="margin-right: 12px; font-size: 0.75rem;">{{ pageName }}</div>
      <ion-button class="admin-logout-btn" (click)="logout()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-tabs>
    <ion-tab-bar slot="bottom" class="admin-footer">
      <ion-tab-button tab="calendar">
        <ion-icon name="calendar-outline"></ion-icon>
        <ion-label>Calendario</ion-label>
      </ion-tab-button>
  
      <ion-tab-button tab="configuration">
        <ion-icon name="settings-outline"></ion-icon>
        <ion-label>Configuración</ion-label>
      </ion-tab-button>
  
      <ion-tab-button tab="profile">
        <ion-icon name="person-outline"></ion-icon>
        <ion-label>Perfil</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>
</ion-content>
