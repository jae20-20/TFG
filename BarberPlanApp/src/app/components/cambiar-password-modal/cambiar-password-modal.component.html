<ion-modal [isOpen]="isOpen" (didDismiss)="cerrar()" class="premium-modal compact-modal">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>Cambiar contraseña</ion-title>
        <ion-buttons slot="end">
          <ion-button class="modal-close-btn" (click)="cerrar()">
            <ion-icon slot="icon-only" name="close-outline"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <div class="compact-modal-body">
      <div class="password-field-group">
        <label>Contraseña actual</label>
        <ion-input class="field-input" type="password" autocomplete="current-password" [(ngModel)]="form.actual">
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>
      </div>

      <div class="password-field-group">
        <label>Nueva contraseña</label>
        <ion-input class="field-input" type="password" autocomplete="new-password" placeholder="Mínimo 8, con letra y número" [(ngModel)]="form.nueva">
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>
      </div>

      <div class="password-field-group">
        <label>Confirmar nueva contraseña</label>
        <ion-input class="field-input" type="password" autocomplete="new-password" placeholder="Repite la nueva contraseña" [(ngModel)]="form.confirmar">
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>
      </div>

      <p *ngIf="error" class="auth-error-hint" role="alert">{{ error }}</p>
    </div>

    <ion-footer>
      <ion-toolbar>
        <ion-button expand="block" class="premium-modal-button-solid ion-margin" (click)="guardar()" [disabled]="guardando">
          <ion-spinner *ngIf="guardando" name="crescent"></ion-spinner>
          <span *ngIf="!guardando">Guardar contraseña</span>
        </ion-button>
      </ion-toolbar>
    </ion-footer>
  </ng-template>
</ion-modal>
